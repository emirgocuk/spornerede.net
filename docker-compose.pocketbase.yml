services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: spornerede-pocketbase
    restart: unless-stopped
    ports:
      - '8090:8090'
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_public:/pb/pb_public
    command: ['--http=0.0.0.0:8090']
