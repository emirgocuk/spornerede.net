      <tspan x="0" dy="0">Spor kursunu bul,</tspan>
      <tspan x="0" dy="70">karsilastir, basvur.</tspan>
    </text>
  </g>

  <g transform="translate(80, 555)">
    <text font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="24" fill="#6c757d" letter-spacing="0">spornerede.net  -  Turkiye'nin spor kulup ve kurs rehberi</text>
