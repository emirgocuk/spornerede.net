<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#fff5f5" />
      <stop offset="1" stop-color="#ffe7e9" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#E30A17" stop-opacity="0.18" />
      <stop offset="1" stop-color="#E30A17" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(80, 90)">
    <text x="0" y="60" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" fill="#1f2933" letter-spacing="-2">spor</text>
    <text x="0" y="135" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" fill="#1f2933" letter-spacing="-2">nerede</text>
    <text x="285" y="115" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="160" fill="#E30A17" letter-spacing="-4">?</text>
  </g>

  <g transform="translate(80, 350)">
