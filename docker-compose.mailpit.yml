version: "3"

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: spornerede-mailpit
    restart: unless-stopped
    ports:
      # SMTP port (uygulama buraya mail gonderir)
      - "1025:1025"
      # Web UI port (mailleri buradan okursun)
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=5000
